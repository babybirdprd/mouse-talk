[package]
name = "speech-to-text-app"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
cpal = "0.16"
rdev = "0.5"
sherpa-rs = { path = "../sherpa-rs/crates/sherpa-rs", features = ["download-binaries"] }
hound = "3.5"
tray-icon = "0.19"
muda = "0.15"
clipboard-win = "5.4"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = [
    "wincon", "winuser", "wingdi", "libloaderapi", 
    "errhandlingapi", "dwmapi", "uxtheme", "synchapi"
] }
